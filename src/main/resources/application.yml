server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/laundry_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: LaundryHikariCP
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      data-source-properties:
        logSlowQueries: true
        slowQueryThresholdMillis: ${DB_SLOW_QUERY_MS:1000}
        autoSlowLog: false
        logger: Slf4JLogger

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:false}
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 7
    baseline-description: pre-flyway-production-schema
    validate-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

photo:
  upload-dir: ./uploads/photos
  url-prefix: /photos
  orphan-retention-hours: ${PHOTO_ORPHAN_RETENTION_HOURS:24}
  capacity-warning-mb: ${PHOTO_CAPACITY_WARNING_MB:10240}
  cleanup-cron: ${PHOTO_CLEANUP_CRON:0 20 4 * * *}

maintenance:
  factory-host: ${FACTORY_HOST:127.0.0.1}
  factory-port: ${FACTORY_PORT:8081}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.laundry.api.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:laundry-backend-jwt-secret-key-2024-very-long-and-secure-enough-for-hs256-algorithm}
  expiration: 86400000

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /api/**
      packages-to-scan:
        - com.laundry.api.controller

logging:
  level:
    com.laundry.api: info
    org.springframework.security: info
    com.mysql.cj.protocol.a.NativeProtocol: warn

app:
  seed-default-users: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,null}
  login:
    max-failures: 5
    window-minutes: 15
    block-minutes: 15
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
  rabbitmq:
    outbox-poll-ms: ${RABBITMQ_OUTBOX_POLL_MS:2000}
    max-publish-attempts: ${RABBITMQ_MAX_PUBLISH_ATTEMPTS:8}
    consumer-max-attempts: ${RABBITMQ_CONSUMER_MAX_ATTEMPTS:3}
    consumer-retry-interval-ms: ${RABBITMQ_CONSUMER_RETRY_INTERVAL_MS:2000}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    pay:
      merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
      merchant-serial: ${WECHAT_PAY_MERCHANT_SERIAL:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    test-login-enabled: ${MINIAPP_TEST_LOGIN_ENABLED:false}
    test-login-key: ${MINIAPP_TEST_LOGIN_KEY:}
    test-phone: ${MINIAPP_TEST_PHONE:}
    test-account-phone: ${MINIAPP_TEST_ACCOUNT_PHONE:}
    test-account-password: ${MINIAPP_TEST_ACCOUNT_PASSWORD:}
