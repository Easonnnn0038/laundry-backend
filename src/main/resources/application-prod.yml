spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        auto-startup: true

photo:
  upload-dir: ${PHOTO_UPLOAD_DIR}

jwt:
  secret: ${JWT_SECRET}

knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: info
    com.laundry.api: info
    org.springframework.security: warn

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
